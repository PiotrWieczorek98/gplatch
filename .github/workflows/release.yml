name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed rust github-cli
      - name: Check the tag matches the package version
        run: |
          source packaging/PKGBUILD
          test "$GITHUB_REF_NAME" = "v$pkgver"
          grep -qx "version = \"$pkgver\"" Cargo.toml
      - name: Build the package
        run: |
          useradd -m builder
          chown -R builder .
          su builder -c 'cd packaging && makepkg --nodeps'
      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" packaging/*.pkg.tar.zst --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
